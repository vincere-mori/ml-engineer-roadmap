name: Check links

on:
  schedule:
    - cron: "0 6 1 * *"
  pull_request:
    paths: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml "**/*.md"
          fail: ${{ github.event_name == 'pull_request' }}

      # раз в месяц не падаем, а заводим issue со списком битых ссылок
      - name: Open issue
        if: steps.lychee.outputs.exit_code != 0 && github.event_name != 'pull_request'
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Битые ссылки (автопроверка)
          content-filepath: ./lychee/out.md
          labels: bug, links
