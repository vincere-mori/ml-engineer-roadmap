name: 🐛 Ошибка или битая ссылка / Error or dead link
description: Ссылка не открывается, инфа устарела или неправда / A link is dead, info is outdated or wrong
labels: ["bug"]
body:
  - type: input
    id: where
    attributes:
      label: Где / Where
      description: Файл или раздел, можно скопировать строку / File or section, you can paste the line
      placeholder: docs/ru/07_mlops.md, таблица Serving
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Что не так и как правильно / What is wrong and what is right
      description: Если знаешь актуальную ссылку или замену, напиши / If you know the current link or a replacement, add it
    validations:
      required: true
